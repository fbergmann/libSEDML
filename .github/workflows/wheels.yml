name: Build Wheels

on:
  workflow_dispatch:
  release:
    types:
    - published
    
jobs:
  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: checkout needed submodules
      run: | 
        ./.ci/checkout-submodules.sh

    - name: Build SDist
      run: |
        cp src/bindings/python/setup.py .
        cp src/bindings/python/MANIFEST.in .
        pipx run build --sdist

    - uses: actions/upload-artifact@v4
      with:
        path: dist/*.tar.gz
        name: libSEDML-sdist
  
  build_wheels:
    name: Wheel on ${{ matrix.os }} for ${{ matrix.python_version }}
    runs-on: ${{ matrix.os }}
    needs: [make_sdist]
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is an Intel runner, macos-14 is Apple silicon
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-14]
        python_version: ['cp39-*', 'cp310-*', 'cp311-*', 'cp312-*', 'cp313-*', 'cp314-*']

    steps:
    - uses: seanmiddleditch/gha-setup-ninja@master

    - name: Add msbuild to PATH (Windows)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install cibuildwheel
      run: |
        python -m pip install cibuildwheel==3.2.1 swig==4.2.1 cmake==3.31.6

        # print versions
        python --version
        cmake --version
        swig -version

    - name: Download sdist
      uses: actions/download-artifact@v4
      with:
        name: libSEDML-sdist
        path: .

    - name: Unpack sdist
      shell: bash
      run: |
        ls -la
        tar zxf python_libsedml-*.tar.gz
        mv python_libsedml-*/* .
        rm -rf python_libsedml-*
        ls -la


    - name: Build wheels
      env:
        CIBW_BUILD: ${{ matrix.python_version }}
        CIBW_SKIP: "*-musllinux* cp36-* cp37-* cp38-* *-win32"
      run: |
        python -m cibuildwheel --output-dir wheelhouse

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        path: wheelhouse/*.whl
        name: libSEDML-${{ matrix.os }}-${{ strategy.job-index }}
    
  merge_wheels:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: libSEDML-*
        path: dist
    
    - name: Move wheels from dist subfolder to dist folder
      run: |
        find dist -name "*.whl" -exec mv {} dist/ \;
        find dist -name "*.tar.gz" -exec mv {} dist/ \;
        find dist -type d -empty -delete

    - uses: actions/upload-artifact@v4
      with:
        name: libSEDML-combined
        path: dist
          

  upload_all:
    needs: [merge_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: libSEDML-combined
        path: dist

    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

