name: Build Wheels (Pyodide)

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: checkout needed submodules
        run: |
          ./.ci/checkout-submodules.sh

      - name: Build SDist
        run: |
          cp src/bindings/python/setup.py .
          cp src/bindings/python/MANIFEST.in .
          pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          path: dist/*.tar.gz
          name: libSEDML-sdist

  build_wheels:
    name: Wheel on ${{ matrix.os }}
    runs-on: ubuntu-latest
    needs: [make_sdist]

    steps:
      - uses: seanmiddleditch/gha-setup-ninja@master

      - name: Add msbuild to PATH (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: |
          python -m pip install cibuildwheel==3.4.0 swig==4.4.1 cmake==3.31.6

          # print versions
          python --version
          cmake --version
          swig -version

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: libSEDML-sdist
          path: .

      - name: Unpack sdist
        shell: bash
        run: |
          ls -la
          tar zxf python_libsedml-*.tar.gz
          mv python_libsedml-*/* .
          rm -rf python_libsedml-*
          ls -la

      - name: Build wheels
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BEFORE_BUILD: 'pip install swig==4.4.1'
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          path: wheelhouse/*.whl
          name: libSEDML-pyodide
